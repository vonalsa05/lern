services:
  api:
    build:
      context: .
    image: security-app:1.0.0

    ports:
      - "8080:8080"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp

    secrets:
      - app_secret

    mem_limit: 128m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3

secrets:
  app_secret:
    file: ./secrets/app_secret.txt
