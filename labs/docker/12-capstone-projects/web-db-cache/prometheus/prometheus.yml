global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: api
    static_configs:
      - targets:
          - api:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Метрики Docker-контейнеров
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  # Метрики PostgreSQL
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  # Метрики Redis
  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
